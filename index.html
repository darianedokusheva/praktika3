<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Стикер-борд</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Стикеры</h2>

    <input type="text" id="stickerInput" placeholder="Введите текст стикера...">
    <button id="addBtn">Добавить</button>

    <div class="wrapper">
        <div class="column">
            <h3>Поле стикеров</h3>
            <div id="stickerPool" class="sticker-pool">
                <p class="empty" id="poolEmpty">Пока пусто</p>
            </div>
            <button id="clearPool">Очистить поле</button>
        </div>

        <div class="column">
            <h3>Борд</h3>
            <div id="board" class="board">
                <p class="empty" id="boardEmpty">Перетащите стикеры сюда</p>
            </div>
            <button id="clearBoard">Очистить борд</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
